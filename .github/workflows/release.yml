name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (for example 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Validate requested version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest="$(python3 -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("Cargo.toml").read(), re.M).group(1))')"
          test "$manifest" = "$VERSION"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists" >&2
            exit 1
          fi

      - name: Verify repository health
        run: |
          bash scripts/namelint.sh
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --release --locked
          cargo test -p verify --release --locked --test gate -- --ignored --nocapture
          cargo test -p verify --release --locked --test truth -- --ignored --nocapture
          python3 scripts/assets.py --check

      - name: Build portable tarballs
        run: |
          bash scripts/package.sh "${{ inputs.version }}" v2
          bash scripts/package.sh "${{ inputs.version }}" v3

      - name: Write and verify checksums
        run: |
          cd dist
          sha256sum enxa-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Smoke test archives
        run: |
          version="${{ inputs.version }}"
          for level in v2 v3; do
            archive="dist/enxa-${version}-x86_64-linux-${level}.tar.gz"
            unpacked="$(mktemp -d)"
            tar xzf "$archive" -C "$unpacked"
            "$unpacked/enso" --version
            "$unpacked/exa" --version
            "$unpacked/benchkit" --version
            cat "$unpacked/RELEASE-INFO.txt"
          done

      - name: Attest tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Create published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/releasenotes.sh "$VERSION" RELEASE_NOTES.md
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "enxa v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            dist/*.tar.gz dist/SHA256SUMS

      - name: Verify GitHub-signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}")"
          kind="$(printf '%s' "$ref" | jq -r .object.type)"
          if [ "$kind" != tag ]; then
            echo "expected an annotated tag object, got $kind" >&2
            exit 1
          fi
          sha="$(printf '%s' "$ref" | jq -r .object.sha)"
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" \
            --jq '.verification | {verified, reason}')"
          echo "$verification"
          printf '%s' "$verification" | jq -e '.verified == true'
